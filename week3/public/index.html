<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>SIT 725 Prac 3</title>

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <nav>
        <div class="nav-wrapper navbar-size">

            <a href="#!" class="brand-logo left">
                <img src="images/hat.png"
                     alt="Hat logo"
                     class="user-image-size">
            </a>

            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li>
                    <a target="_blank"
                       href="https://github.com/Gulraba-Mardan/SIT725_s224414026">
                        GitHub
                    </a>
                </li>
            </ul>

        </div>
    </nav>

    <main class="main-body">

        <div class="container">

            <div class="row">

                <div class="col s12 center-align">

                    <h1 id="heading">Welcome to SIT 725 Week 3</h1>

                    <p class="flow-text">
                        This is a demo application that uses Materialize components
                        in an Express web application.
                    </p>

                </div>

                <div class="col s12 center-align">

                    <img class="materialboxed materialboxed-image"
                         src="images/robot.png"
                         alt="Demo image">

                </div>

                <div class="col s12 center-align">

                    <a class="waves-effect waves-light btn click-me-button"
                       id="clickMeButton">

                        <i class="material-icons left">auto_fix_high</i>
                        Click Me

                    </a>

                </div>

            </div>

            <div class="row" id="card-section">

                <div class="col s4 center-align">

                    <div class="card medium">

                        <div class="card-image waves-effect waves-block waves-light">

                            <img class="activator"
                                 src="images/kitten.jpg"
                                 alt="Kitten">

                        </div>

                        <div class="card-content">

                            <span class="card-title activator grey-text text-darken-4">
                                Kitten
                                <i class="material-icons right">more_vert</i>
                            </span>

                            <p>
                                <a href="#">About this kitten</a>
                            </p>

                        </div>

                        <div class="card-reveal">

                            <span class="card-title grey-text text-darken-4">
                                Kitten
                                <i class="material-icons right">close</i>
                            </span>

                            <p class="card-text">
                                Hello There! I just wanted to say HI to you guys. See ya!
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

    <script src="js/scripts.js"></script>

</body>

</html>
